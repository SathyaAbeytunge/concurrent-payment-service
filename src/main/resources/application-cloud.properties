# The hosting platform supplies PORT. Locally, the container defaults to 8080.
server.port=${PORT:8080}

# Enter these values in the hosting dashboard, not in Git. Use Supabase's session pooler.
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Keep application tables separate from Supabase's public/Data API schema.
spring.flyway.default-schema=payments
spring.flyway.schemas=payments
spring.jpa.properties.hibernate.default_schema=payments
spring.datasource.hikari.connection-init-sql=SET search_path TO payments, public
spring.jpa.open-in-view=false

# Use the Redis TCP connection URL; Upstash requires rediss:// for TLS.
spring.data.redis.url=${REDIS_URL}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# PostgreSQL is required for readiness; Redis is an optional cache.
management.health.redis.enabled=false
